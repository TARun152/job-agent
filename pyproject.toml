[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
description = "Job discovery, resume tailoring, and one-click approval apply agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tarun" }]
dependencies = [
  "fastapi>=0.115.0",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "playwright>=1.48.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "reportlab>=4.2.5",
  "jinja2>=3.1.4",
  "apscheduler>=3.10.4",
  "google-api-python-client>=2.149.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.1",
  "openai>=1.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
  "httpx>=0.27.0",
]

[project.scripts]
job-agent = "job_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_agent = ["queue/templates/*.html", "queue/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
